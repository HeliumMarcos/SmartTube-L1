name: Helium ARMv7 APK (manual)
# Rebuild UI-modernization branch with restored Android HttpEngine network transport.

on:
  workflow_dispatch:
  push:
    branches: [helium-ui-modernization]

permissions:
  contents: write

concurrency:
  group: helium-armv7-manual
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore persistent signing key
        shell: bash
        env:
          L1_KEYSTORE_BASE64: ${{ secrets.L1_KEYSTORE_BASE64 }}
          L1_STORE_PASSWORD: ${{ secrets.L1_STORE_PASSWORD }}
          L1_KEY_ALIAS: ${{ secrets.L1_KEY_ALIAS }}
          L1_KEY_PASSWORD: ${{ secrets.L1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in L1_KEYSTORE_BASE64 L1_STORE_PASSWORD L1_KEY_ALIAS L1_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret $key. Configure a persistent signing key before releasing updateable APKs."
              exit 1
            fi
          done
          printf '%s' "$L1_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/l1-signing.jks"
          chmod 600 "$RUNNER_TEMP/l1-signing.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/l1-signing.jks"
            printf 'storePassword=%s\n' "$L1_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$L1_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$L1_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          keytool -list -keystore "$RUNNER_TEMP/l1-signing.jks" -storepass "$L1_STORE_PASSWORD" -alias "$L1_KEY_ALIAS" >/dev/null

      - name: Verify ARMv7-only configuration
        shell: bash
        run: |
          grep -Fq "include 'armeabi-v7a'" smarttubetv/build.gradle
          grep -q "universalApk false" smarttubetv/build.gradle
          if grep -Eq "^[[:space:]]*abiFilters[[:space:]]" smarttubetv/build.gradle; then
            echo "::error::Remove ndk abiFilters: it conflicts with splits.abi"
            exit 1
          fi
          grep -Fq 'applicationId "app.smarttube.l1.beta"' smarttubetv/build.gradle

      - name: Build signed ARMv7 release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :smarttubetv:assembleStbetaRelease --no-daemon

      - name: Verify APK signature and update version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find smarttubetv/build/outputs/apk -type f -name '*armeabi-v7a.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          signature="$("$tools/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$signature"
          fingerprint="$(awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' <<< "$signature")"
          if [[ "$fingerprint" != 4bb3ab895550dc9d8ff13f14037fac6bb721d5d2ab382dfc274be56aa101f3a1 ]]; then
            echo "::error::The APK certificate does not match the SmartTube-L1 update certificate."
            exit 1
          fi
          badging="$("$tools/aapt" dump badging "$apk")"
          package="$(awk -F"'" '/^package: / { print $2; exit }' <<< "$badging")"
          version_code="$(awk -F"'" '/^package: / { print $4; exit }' <<< "$badging")"
          version_name="$(awk -F"'" '/^package: / { print $6; exit }' <<< "$badging")"
          test "$package" = app.smarttube.l1.beta
          test "$version_code" = "$((2462 + GITHUB_RUN_NUMBER))"
          test -n "$version_name"
          grep -Eq "^native-code: 'armeabi-v7a'[[:space:]]*$" <<< "$badging"
          {
            echo "path=$apk"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"
          echo "CI versionCode: $version_code" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ARMv7 APK only
        uses: actions/upload-artifact@v5
        with:
          name: SmartTube-L1-ARMv7
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish the APK and update manifest in GitHub Releases
        if: ${{ github.ref == 'refs/heads/helium-ui-modernization' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          tag="l1-armv7-build-${GITHUB_RUN_NUMBER}"
          latest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ "$latest" =~ ^l1-armv7-build-([0-9]+)$ ]] && (( BASH_REMATCH[1] >= GITHUB_RUN_NUMBER )); then
            echo "The published update is already at or above build ${GITHUB_RUN_NUMBER}."
            exit 0
          fi

          apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/SmartTube-L1-ARMv7.apk"
          cp "$APK_PATH" SmartTube-L1-ARMv7.apk
          jq -n --arg url "$apk_url" --arg version "$VERSION_NAME · build ${GITHUB_RUN_NUMBER}" \
            --argjson code "$VERSION_CODE" \
            '{package: {downloadUrl: $url}, ($version): {versionCode: $code, changelog: ["L1-Tube ARMv7 update"], changelog_pt: ["Atualização do L1-Tube para ARMv7"]}}' \
            > smarttube-l1-update.json

          gh release create "$tag" SmartTube-L1-ARMv7.apk smarttube-l1-update.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "L1-Tube ARMv7 · build ${GITHUB_RUN_NUMBER}" \
            --notes "Signed L1-Tube APK for Android TV (armeabi-v7a). This release also supplies the app's update manifest." \
            --latest
          echo "Direct APK: $apk_url" >> "$GITHUB_STEP_SUMMARY"
