name: Helium ARMv7 APK (manual)
# Rebuild requested after repository signing secrets were configured.

on:
  workflow_dispatch:
  push:
    branches: [helium-enhanced]
    paths:
      - '.github/workflows/helium-armv7-manual.yml'

permissions:
  contents: write

concurrency:
  group: helium-armv7-manual
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v5
        with:
          ref: helium-enhanced
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore persistent signing key
        shell: bash
        env:
          L1_KEYSTORE_BASE64: ${{ secrets.L1_KEYSTORE_BASE64 }}
          L1_STORE_PASSWORD: ${{ secrets.L1_STORE_PASSWORD }}
          L1_KEY_ALIAS: ${{ secrets.L1_KEY_ALIAS }}
          L1_KEY_PASSWORD: ${{ secrets.L1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in L1_KEYSTORE_BASE64 L1_STORE_PASSWORD L1_KEY_ALIAS L1_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret $key. Configure a persistent signing key before releasing updateable APKs."
              exit 1
            fi
          done
          printf '%s' "$L1_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/l1-signing.jks"
          chmod 600 "$RUNNER_TEMP/l1-signing.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/l1-signing.jks"
            printf 'storePassword=%s\n' "$L1_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$L1_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$L1_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          keytool -list -keystore "$RUNNER_TEMP/l1-signing.jks" -storepass "$L1_STORE_PASSWORD" -alias "$L1_KEY_ALIAS" >/dev/null

      - name: Verify ARMv7-only configuration
        shell: bash
        run: |
          grep -Fq "include 'armeabi-v7a'" smarttubetv/build.gradle
          grep -q "universalApk false" smarttubetv/build.gradle
          if grep -Eq "^[[:space:]]*abiFilters[[:space:]]" smarttubetv/build.gradle; then
            echo "::error::Remove ndk abiFilters: it conflicts with splits.abi"
            exit 1
          fi
          grep -Fq 'applicationId "app.smarttube.l1.beta"' smarttubetv/build.gradle

      - name: Build ARMv7 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :smarttubetv:assembleStbetaDebug --no-daemon

      - name: Verify APK signature and update version
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find smarttubetv/build/outputs/apk -type f -name '*armeabi-v7a.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          echo "CI versionCode: $((2462 + GITHUB_RUN_NUMBER))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ARMv7 APK only
        uses: actions/upload-artifact@v5
        with:
          name: SmartTube-L1-ARMv7
          path: smarttubetv/build/outputs/apk/**/*armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct APK download in GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find smarttubetv/build/outputs/apk -type f -name '*armeabi-v7a.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ARMv7 APK, found ${#apks[@]}"
            exit 1
          fi
          tag="l1-armv7-build-${GITHUB_RUN_NUMBER}"
          cp "${apks[0]}" SmartTube-L1-ARMv7.apk
          gh release create "$tag" SmartTube-L1-ARMv7.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target helium-enhanced \
            --title "SmartTube-L1 ARMv7 test build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated ARMv7 debug test APK from helium-enhanced. Experimental audio selection and diagnostics; validate on TV." \
            --prerelease
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/SmartTube-L1-ARMv7.apk" >> "$GITHUB_STEP_SUMMARY"
