name: SmartTube-L1 video algorithm tests

on:
  push:
    branches: [helium-enhanced]
    paths:
      - 'common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/selector/**'
      - 'common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/versions/selector/**'
      - 'common/src/test/**'
      - '.github/workflows/helium-video-tests.yml'
  workflow_dispatch:

jobs:
  video-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Run video unit tests
        run: ./gradlew :common:testStbetaDebugUnitTest --tests '*AutomaticVideoSelectionTest' --stacktrace --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-l1-video-tests
          path: |
            common/build/reports/tests/
            common/build/test-results/
          if-no-files-found: ignore
